<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="20" fill="url(#bg)"/>
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#134e4a" stroke-width="2"/>

  <!-- Title Banner -->
  <text x="400" y="70" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="bold" font-size="28" fill="#f8fafc">
    🔢 MathQuest: Decimals &amp; Place Value
  </text>
  <text x="400" y="100" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8">
    Georgia Standards MGSE5.NBT.7 &amp; MGSE6.NS.3
  </text>

  <!-- Section 1: Line Up Decimal Points -->
  <rect x="50" y="130" width="330" height="200" rx="12" fill="#115e59" fill-opacity="0.2" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="70" y="165" font-family="'Outfit', sans-serif" font-weight="bold" font-size="18" fill="#2dd4bf">
    1. Line Up The Decimals!
  </text>
  <text x="70" y="195" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">
    Always stack digits by place value:
  </text>
  <!-- Vertical Math Block -->
  <g font-family="'Courier New', monospace" font-size="18" fill="#f8fafc">
    <text x="120" y="230">  3 . 4 0</text>
    <text x="120" y="255">+ 2 . 8 5</text>
    <line x1="120" y1="265" x2="210" y2="265" stroke="#2dd4bf" stroke-width="2"/>
    <text x="120" y="290" fill="#34d399">  6 . 2 5</text>
  </g>

  <!-- Section 2: Placeholder Zeros -->
  <rect x="420" y="130" width="330" height="200" rx="12" fill="#115e59" fill-opacity="0.2" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="440" y="165" font-family="'Outfit', sans-serif" font-weight="bold" font-size="18" fill="#38bdf8">
    2. Add Placeholder Zeros
  </text>
  <text x="440" y="195" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">
    When subtracting, annex placeholder zeros:
  </text>
  <g font-family="'Courier New', monospace" font-size="18" fill="#f8fafc">
    <text x="490" y="230">  5 . 0 0  (not 5.0)</text>
    <text x="490" y="255">- 2 . 3 5</text>
    <line x1="490" y1="265" x2="580" y2="265" stroke="#38bdf8" stroke-width="2"/>
    <text x="490" y="290" fill="#34d399">  2 . 6 5</text>
  </g>
  <text x="440" y="315" font-family="'Inter', sans-serif" font-size="12" fill="#f87171">
    ⚠️ Don't just bring down the 5 to get 3.35!
  </text>

  <!-- Section 3: Place Values Chart -->
  <rect x="50" y="360" width="700" height="180" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="80" y="400" font-family="'Outfit', sans-serif" font-weight="bold" font-size="18" fill="#fcd34d">
    3. The Place Value Ruler
  </text>
  <text x="80" y="435" font-family="'Inter', sans-serif" font-size="14" fill="#cbd5e1">
    Hundreds [100] • Tens [10] • Ones [1]  • • • POINT • • •  Tenths [0.1] • Hundredths [0.01]
  </text>
  <text x="80" y="475" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">
    10 tenths regroup into 1 one. 10 hundredths regroup into 1 tenth.
  </text>
  <text x="80" y="510" font-family="'Inter', sans-serif" font-style="italic" font-size="13" fill="#2dd4bf">
    🌟 MathQuest Pro Tip: 0.7 + 0.8 is 1.5, not 0.15! Always regroup across columns.
  </text>
</svg>
