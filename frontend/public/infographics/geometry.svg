<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="20" fill="url(#bg)"/>
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#065f46" stroke-width="2"/>

  <!-- Title Banner -->
  <text x="400" y="70" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="bold" font-size="28" fill="#f8fafc">
    📐 MathQuest: Geometry (Area &amp; Perimeter)
  </text>
  <text x="400" y="100" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8">
    Georgia Standards MGSE5.MD.1 &amp; MGSE6.G.1
  </text>

  <!-- Section 1: Rectangle (Area vs Perimeter) -->
  <rect x="50" y="130" width="330" height="200" rx="12" fill="#064e3b" fill-opacity="0.2" stroke="#059669" stroke-width="1.5"/>
  <text x="70" y="165" font-family="'Outfit', sans-serif" font-weight="bold" font-size="18" fill="#34d399">
    1. Rectangles: Area vs Perimeter
  </text>
  <text x="70" y="195" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">
    • Perimeter (Distance Around):
  </text>
  <text x="85" y="220" font-family="'Inter', sans-serif" font-weight="bold" font-size="14" fill="#a7f3d0">
    P = 2 × (length + width)
  </text>
  <text x="70" y="250" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">
    • Area (Space Inside):
  </text>
  <text x="85" y="275" font-family="'Inter', sans-serif" font-weight="bold" font-size="14" fill="#34d399">
    A = length × width
  </text>
  <text x="70" y="310" font-family="'Inter', sans-serif" font-size="12" fill="#f87171">
    ⚠️ Don't mix up perimeter (units) and area (sq units)!
  </text>

  <!-- Section 2: Triangle (Don't Forget to Halve) -->
  <rect x="420" y="130" width="330" height="200" rx="12" fill="#064e3b" fill-opacity="0.2" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="165" font-family="'Outfit', sans-serif" font-weight="bold" font-size="18" fill="#38bdf8">
    2. Triangles: Halve the Rectangle!
  </text>
  <text x="440" y="195" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">
    A triangle is HALF of a rectangle:
  </text>
  <text x="455" y="235" font-family="'Inter', sans-serif" font-weight="bold" font-size="18" fill="#67e8f9">
    Area = ½ × base × height
  </text>
  <text x="455" y="265" font-family="'Inter', sans-serif" font-weight="bold" font-size="15" fill="#a5f3fc">
    Area = (base × height) ÷ 2
  </text>
  <text x="440" y="305" font-family="'Inter', sans-serif" font-size="12" fill="#f87171">
    ⚠️ Forgetting to divide by 2 gives double the true area!
  </text>

  <!-- Section 3: Summary Formulas -->
  <rect x="50" y="360" width="700" height="180" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="80" y="400" font-family="'Outfit', sans-serif" font-weight="bold" font-size="18" fill="#fcd34d">
    3. Georgia MGSE Formula Vault
  </text>
  <text x="80" y="435" font-family="'Inter', sans-serif" font-size="14" fill="#cbd5e1">
    • Rectangle with 8m by 5m: Perimeter = 2×(8+5) = 26m | Area = 8×5 = 40 m²
  </text>
  <text x="80" y="470" font-family="'Inter', sans-serif" font-size="14" fill="#cbd5e1">
    • Triangle with base 10in, height 6in: Area = (10 × 6) ÷ 2 = 30 in²
  </text>
  <text x="80" y="510" font-family="'Inter', sans-serif" font-style="italic" font-size="13" fill="#34d399">
    🌟 MathQuest Pro Tip: Square units (m², in², ft²) are always for Area!
  </text>
</svg>
