<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="int-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="int-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="int-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="20" fill="url(#int-bg)"/>
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#312e81" stroke-width="2"/>

  <!-- Title Banner -->
  <text x="400" y="68" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="bold" font-size="28" fill="#f8fafc">
    🏔️ MathQuest: Integers &amp; the Number Line
  </text>
  <text x="400" y="96" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8">
    CBSE Class 6 NCERT Ganita Prakash (CBSE6.MATH.04)
  </text>

  <!-- Number Line Visual Banner across top -->
  <rect x="50" y="120" width="700" height="95" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="400" y="145" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="bold" font-size="15" fill="#2dd4bf">
    The Integer Number Line (Zero is the Origin)
  </text>

  <!-- Axis Line -->
  <line x1="80" y1="180" x2="720" y2="180" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="75,180 85,174 85,186" fill="#94a3b8"/>
  <polygon points="725,180 715,174 715,186" fill="#94a3b8"/>

  <!-- Ticks & Labels: -5 to +5 -->
  <!-- -5 -->
  <line x1="110" y1="172" x2="110" y2="188" stroke="#fb7185" stroke-width="2"/>
  <text x="110" y="203" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#fb7185">-5</text>
  <!-- -4 -->
  <line x1="170" y1="172" x2="170" y2="188" stroke="#fb7185" stroke-width="2"/>
  <text x="170" y="203" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#fb7185">-4</text>
  <!-- -3 -->
  <line x1="230" y1="172" x2="230" y2="188" stroke="#fb7185" stroke-width="2"/>
  <text x="230" y="203" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#fb7185">-3</text>
  <!-- -2 -->
  <line x1="290" y1="172" x2="290" y2="188" stroke="#fb7185" stroke-width="2"/>
  <text x="290" y="203" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#fb7185">-2</text>
  <!-- -1 -->
  <line x1="350" y1="172" x2="350" y2="188" stroke="#fb7185" stroke-width="2"/>
  <text x="350" y="203" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#fb7185">-1</text>
  <!-- 0 -->
  <line x1="400" y1="168" x2="400" y2="192" stroke="#f8fafc" stroke-width="3"/>
  <circle cx="400" cy="180" r="5" fill="#f8fafc"/>
  <text x="400" y="205" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="black" fill="#f8fafc">0</text>
  <!-- +1 -->
  <line x1="450" y1="172" x2="450" y2="188" stroke="#34d399" stroke-width="2"/>
  <text x="450" y="203" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#34d399">+1</text>
  <!-- +2 -->
  <line x1="510" y1="172" x2="510" y2="188" stroke="#34d399" stroke-width="2"/>
  <text x="510" y="203" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#34d399">+2</text>
  <!-- +3 -->
  <line x1="570" y1="172" x2="570" y2="188" stroke="#34d399" stroke-width="2"/>
  <text x="570" y="203" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#34d399">+3</text>
  <!-- +4 -->
  <line x1="630" y1="172" x2="630" y2="188" stroke="#34d399" stroke-width="2"/>
  <text x="630" y="203" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#34d399">+4</text>
  <!-- +5 -->
  <line x1="690" y1="172" x2="690" y2="188" stroke="#34d399" stroke-width="2"/>
  <text x="690" y="203" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#34d399">+5</text>

  <!-- Left: Direction & Comparison Rules -->
  <rect x="50" y="235" width="330" height="175" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="265" font-family="'Outfit', sans-serif" font-weight="bold" font-size="17" fill="#38bdf8">
    1. Navigation Rules
  </text>
  <text x="70" y="295" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">
    👉 Move <tspan fill="#34d399" font-weight="bold">RIGHT</tspan> to ADD / Increase
  </text>
  <text x="70" y="325" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">
    👈 Move <tspan fill="#fb7185" font-weight="bold">LEFT</tspan> to SUBTRACT / Decrease
  </text>
  <text x="70" y="355" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">
    📏 Absolute Value |x|: distance from 0
  </text>
  <text x="70" y="385" font-family="'Inter', sans-serif" font-weight="bold" font-size="12" fill="#facc15">
    Example: |-5| = 5 and |+5| = 5
  </text>

  <!-- Right: Adding Integers -->
  <rect x="420" y="235" width="330" height="175" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="440" y="265" font-family="'Outfit', sans-serif" font-weight="bold" font-size="17" fill="#34d399">
    2. Adding Integers
  </text>

  <!-- Case A: Like Signs -->
  <rect x="440" y="280" width="290" height="50" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="455" y="300" font-family="'Inter', sans-serif" font-weight="bold" font-size="12" fill="#f8fafc">Same Signs: Add &amp; Keep Sign</text>
  <text x="455" y="318" font-family="'Inter', sans-serif" font-weight="bold" font-size="12" fill="#fb7185">(-4) + (-3) = -7</text>

  <!-- Case B: Unlike Signs -->
  <rect x="440" y="340" width="290" height="55" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="455" y="360" font-family="'Inter', sans-serif" font-weight="bold" font-size="12" fill="#f8fafc">Different Signs: Subtract &amp; Take Bigger</text>
  <text x="455" y="380" font-family="'Inter', sans-serif" font-weight="bold" font-size="12" fill="#34d399">(-5) + 8 = +3  <tspan fill="#94a3b8" font-weight="normal">(8 has greater distance)</tspan></text>

  <!-- Bottom Strip: Common Traps -->
  <rect x="50" y="425" width="700" height="140" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="75" y="455" font-family="'Outfit', sans-serif" font-weight="bold" font-size="16" fill="#f87171">
    ⚠️ Critical Integer Misconceptions
  </text>

  <rect x="75" y="470" width="310" height="80" rx="8" fill="#0f172a" stroke="#450a0a"/>
  <text x="90" y="493" font-family="'Inter', sans-serif" font-weight="bold" font-size="12" fill="#fca5a5">Trap #1: Distance Ordering</text>
  <text x="90" y="513" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">-10 is NOT greater than -2!</text>
  <text x="90" y="533" font-family="'Inter', sans-serif" font-weight="bold" font-size="12" fill="#34d399">-10 &lt; -2 (it's further left on the line).</text>

  <rect x="415" y="470" width="310" height="80" rx="8" fill="#0f172a" stroke="#450a0a"/>
  <text x="430" y="493" font-family="'Inter', sans-serif" font-weight="bold" font-size="12" fill="#fca5a5">Trap #2: Adding Two Negatives</text>
  <text x="430" y="513" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">Two negatives only multiply to positive.</text>
  <text x="430" y="533" font-family="'Inter', sans-serif" font-weight="bold" font-size="12" fill="#38bdf8">(-4) + (-5) = -9 (Two debts = bigger debt!)</text>
</svg>
