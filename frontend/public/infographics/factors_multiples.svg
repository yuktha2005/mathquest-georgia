<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="fm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="fm-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="fm-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="20" fill="url(#fm-bg)"/>
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#312e81" stroke-width="2"/>

  <!-- Title Banner -->
  <text x="400" y="68" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="bold" font-size="28" fill="#f8fafc">
    🔢 MathQuest: Factors, Multiples &amp; Primes
  </text>
  <text x="400" y="96" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8">
    CBSE Class 6 NCERT Ganita Prakash (CBSE6.MATH.01)
  </text>

  <!-- Panel 1: Primes vs Composites & Factor Trees -->
  <rect x="50" y="125" width="330" height="235" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="160" font-family="'Outfit', sans-serif" font-weight="bold" font-size="18" fill="#60a5fa">
    1. Primes &amp; Factor Trees
  </text>
  <text x="70" y="188" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">
    Primes have EXACTLY two factors: 1 &amp; itself.
  </text>

  <!-- Visual Factor Tree for 12 -->
  <circle cx="130" cy="225" r="16" fill="#3b82f6"/>
  <text x="130" y="230" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="bold" font-size="13" fill="#fff">12</text>

  <line x1="120" y1="241" x2="95" y2="265" stroke="#94a3b8" stroke-width="2"/>
  <line x1="140" y1="241" x2="165" y2="265" stroke="#94a3b8" stroke-width="2"/>

  <circle cx="95" cy="280" r="14" fill="#10b981"/>
  <text x="95" y="285" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="bold" font-size="12" fill="#fff">2</text>

  <circle cx="165" cy="280" r="14" fill="#3b82f6"/>
  <text x="165" y="285" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="bold" font-size="12" fill="#fff">6</text>

  <line x1="155" y1="294" x2="140" y2="315" stroke="#94a3b8" stroke-width="2"/>
  <line x1="175" y1="294" x2="190" y2="315" stroke="#94a3b8" stroke-width="2"/>

  <circle cx="140" cy="330" r="14" fill="#10b981"/>
  <text x="140" y="335" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="bold" font-size="12" fill="#fff">2</text>

  <circle cx="190" cy="330" r="14" fill="#10b981"/>
  <text x="190" y="335" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="bold" font-size="12" fill="#fff">3</text>

  <text x="240" y="250" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Prime Factors:</text>
  <rect x="235" y="260" width="125" height="28" rx="6" fill="#047857"/>
  <text x="297" y="279" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="bold" font-size="13" fill="#fff">12 = 2 × 2 × 3</text>

  <text x="240" y="315" font-family="'Inter', sans-serif" font-size="11" fill="#34d399">✓ 2 and 3 are prime!</text>

  <!-- Panel 2: Highest Common Factor (HCF) & Lowest Common Multiple (LCM) -->
  <rect x="420" y="125" width="330" height="235" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="440" y="160" font-family="'Outfit', sans-serif" font-weight="bold" font-size="18" fill="#34d399">
    2. HCF (GCD) &amp; LCM
  </text>
  <text x="440" y="188" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">
    Finding common ground between numbers:
  </text>

  <!-- HCF Card -->
  <rect x="440" y="205" width="290" height="65" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="455" y="228" font-family="'Outfit', sans-serif" font-weight="bold" font-size="13" fill="#60a5fa">HCF of 12 &amp; 18 = 6</text>
  <text x="455" y="246" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Factors of 12: 1, 2, 3, 4, <tspan fill="#34d399" font-weight="bold">6</tspan>, 12</text>
  <text x="455" y="260" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Factors of 18: 1, 2, 3, <tspan fill="#34d399" font-weight="bold">6</tspan>, 9, 18</text>

  <!-- LCM Card -->
  <rect x="440" y="280" width="290" height="65" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="455" y="303" font-family="'Outfit', sans-serif" font-weight="bold" font-size="13" fill="#fbbf24">LCM of 4 &amp; 6 = 12</text>
  <text x="455" y="321" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Multiples of 4: 4, 8, <tspan fill="#fbbf24" font-weight="bold">12</tspan>, 16, 20...</text>
  <text x="455" y="335" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Multiples of 6: 6, <tspan fill="#fbbf24" font-weight="bold">12</tspan>, 18, 24...</text>

  <!-- Bottom Strip: Common Traps & Rules -->
  <rect x="50" y="380" width="700" height="170" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="75" y="415" font-family="'Outfit', sans-serif" font-weight="bold" font-size="16" fill="#f87171">
    ⚠️ Critical Misconception Traps to Avoid
  </text>

  <rect x="75" y="430" width="310" height="100" rx="8" fill="#0f172a" stroke="#450a0a"/>
  <text x="90" y="455" font-family="'Inter', sans-serif" font-weight="bold" font-size="13" fill="#fca5a5">Trap #1: 1 is NOT Prime</text>
  <text x="90" y="475" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">Prime numbers must have 2 distinct factors.</text>
  <text x="90" y="495" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">1 only has 1 factor (itself), so 1 is neither!</text>
  <text x="90" y="515" font-family="'Inter', sans-serif" font-weight="bold" font-size="12" fill="#34d399">The smallest prime number is 2.</text>

  <rect x="415" y="430" width="310" height="100" rx="8" fill="#0f172a" stroke="#450a0a"/>
  <text x="430" y="455" font-family="'Inter', sans-serif" font-weight="bold" font-size="13" fill="#fca5a5">Trap #2: Not All Odds are Prime</text>
  <text x="430" y="475" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">9 is odd, but 3 × 3 = 9 (composite!).</text>
  <text x="430" y="495" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">15 is odd, but 3 × 5 = 15 (composite!).</text>
  <text x="430" y="515" font-family="'Inter', sans-serif" font-weight="bold" font-size="12" fill="#38bdf8">Always test for divisibility by 3, 5, and 7!</text>
</svg>
