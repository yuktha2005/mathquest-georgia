<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="20" fill="url(#bg)"/>
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#581c87" stroke-width="2"/>

  <!-- Title Banner -->
  <text x="400" y="70" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="bold" font-size="28" fill="#f8fafc">
    ⚖️ MathQuest: Ratios &amp; Proportions
  </text>
  <text x="400" y="100" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8">
    Georgia Standards MGSE6.RP.1 &amp; MGSE6.RP.3
  </text>

  <!-- Section 1: Multiplicative Scaling -->
  <rect x="50" y="130" width="330" height="200" rx="12" fill="#2e1065" fill-opacity="0.3" stroke="#9333ea" stroke-width="1.5"/>
  <text x="70" y="165" font-family="'Outfit', sans-serif" font-weight="bold" font-size="18" fill="#c084fc">
    1. Scale with Multiplication
  </text>
  <text x="70" y="195" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">
    Ratios are MULTIPLICATIVE, not additive!
  </text>
  <g transform="translate(70, 215)">
    <rect x="0" y="0" width="50" height="30" rx="4" fill="#9333ea"/>
    <text x="25" y="20" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="bold" fill="#fff">2</text>
    <text x="65" y="22" font-family="'Inter', sans-serif" font-weight="bold" font-size="16" fill="#cbd5e1">:</text>
    <rect x="80" y="0" width="50" height="30" rx="4" fill="#a855f7"/>
    <text x="105" y="20" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="bold" fill="#fff">3</text>

    <text x="145" y="20" font-family="'Inter', sans-serif" font-weight="bold" font-size="16" fill="#38bdf8">×</text>
    <text x="165" y="20" font-family="'Inter', sans-serif" font-weight="bold" font-size="16" fill="#38bdf8">3</text>
    <text x="190" y="20" font-family="'Inter', sans-serif" font-weight="bold" font-size="16" fill="#cbd5e1">=</text>

    <rect x="210" y="0" width="50" height="30" rx="4" fill="#10b981"/>
    <text x="235" y="20" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="bold" fill="#fff">6</text>
    <text x="270" y="22" font-family="'Inter', sans-serif" font-weight="bold" font-size="16" fill="#cbd5e1">:</text>
    <rect x="280" y="0" width="50" height="30" rx="4" fill="#10b981"/>
    <text x="305" y="20" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="bold" fill="#fff">9</text>
  </g>
  <text x="70" y="290" font-family="'Inter', sans-serif" font-size="12" fill="#f87171">
    ⚠️ Misconception: 6 - 2 = 4, so 3 + 4 = 7 (WRONG!)
  </text>
  <text x="70" y="310" font-family="'Inter', sans-serif" font-size="12" fill="#34d399">
    ✅ Correct: Multiply both terms by scale factor 3!
  </text>

  <!-- Section 2: Order Matters -->
  <rect x="420" y="130" width="330" height="200" rx="12" fill="#2e1065" fill-opacity="0.3" stroke="#9333ea" stroke-width="1.5"/>
  <text x="440" y="165" font-family="'Outfit', sans-serif" font-weight="bold" font-size="18" fill="#f472b6">
    2. Order Matters!
  </text>
  <text x="440" y="195" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">
    "Flutes to Clarinets is 2 : 3"
  </text>
  <text x="440" y="225" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">
    • 1st number corresponds to Flutes (2)
  </text>
  <text x="440" y="250" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">
    • 2nd number corresponds to Clarinets (3)
  </text>
  <text x="440" y="285" font-family="'Inter', sans-serif" font-size="12" fill="#f87171">
    ⚠️ Inverting the ratio to 3 : 2 changes the relationship!
  </text>

  <!-- Section 3: Unit Rates -->
  <rect x="50" y="360" width="700" height="180" rx="12" fill="#18181b" stroke="#334155" stroke-width="1.5"/>
  <text x="80" y="400" font-family="'Outfit', sans-serif" font-weight="bold" font-size="18" fill="#38bdf8">
    3. Finding the Unit Rate
  </text>
  <text x="80" y="435" font-family="'Inter', sans-serif" font-size="14" fill="#cbd5e1">
    Divide to find the value of ONE unit: $18 for 6 bags → $18 ÷ 6 = $3 per bag.
  </text>
  <text x="80" y="470" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">
    Then multiply by the target quantity: $3 × 10 bags = $30.
  </text>
  <text x="80" y="510" font-family="'Inter', sans-serif" font-style="italic" font-size="13" fill="#c084fc">
    🌟 MathQuest Pro Tip: Tape diagrams and ratio tables make scaling easy to visualize!
  </text>
</svg>
