# Render Blueprint Specification for MathQuest Georgia
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: mathquest-georgia-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_MODEL_ALT
        value: gemini-2.5-pro
      - key: GEMINI_EMBED_MODEL
        value: text-embedding-004
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: EVAL_SAMPLE_SIZE
        value: "3"
