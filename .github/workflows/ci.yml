name: CI - MathQuest Georgia

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest with coverage and validation
        env:
          GEMINI_API_KEY: ci_dummy_key_for_testing
          GEMINI_MODEL: gemini-2.5-flash
          GEMINI_MODEL_ALT: gemini-2.5-pro
          GEMINI_EMBED_MODEL: text-embedding-004
          SUPABASE_URL: https://ci-dummy.supabase.co
          SUPABASE_KEY: ci_dummy_key
          FRONTEND_URL: http://localhost:3000
          TESTING: "true"
        run: |
          cd backend
          python -m pytest -v

  build-frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Nuxt 3 application
        run: |
          cd frontend
          npm run build
